*{box-sizing:border-box}body{margin:0;background:#f8f9f5;color:#29352e;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}main{max-width:1200px;margin:auto;padding:40px 24px}a{color:#476d52}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:30px;letter-spacing:-1px}.intro{font-size:14px;color:#778078;line-height:1.9}video{display:block;width:100%;aspect-ratio:16/9;border-radius:15px;background:#edf2ed;margin:22px 0}nav{display:flex;gap:20px;font-size:13px;margin:20px 0}.chapters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.chapters button{border:1px solid #e0e6da;border-radius:10px;background:white;padding:15px;text-align:left;color:#3d654e;cursor:pointer;font:inherit;font-size:12px;line-height:1.6}.chapters button[aria-current=true]{border-color:#3d654e;background:#edf2ed}.chapters small{display:block;color:#8a9587;margin-bottom:3px}.note{margin-top:26px;background:#edf2ed;padding:18px;border-radius:12px;color:#71816e;font-size:12px;line-height:1.9}nav button{border:0;background:#edf2ed;color:#3d654e;padding:4px 12px;border-radius:6px;cursor:pointer;font:inherit}button:focus-visible,a:focus-visible{outline:2px solid #3d654e;outline-offset:3px}@media(max-width:600px){main{padding:22px 16px}h1{font-size:23px}header{display:block}.chapters{grid-template-columns:repeat(2,minmax(0,1fr))}nav{flex-wrap:wrap}}
</style></head><body><main><header><h1>亦伴 v0.6 · 怎么操作</h1><a href="../personal/">打开交互演示 ↗</a></header><p class="intro">3 分 07 秒 · 中文讲解 · 12 个章节。先学操作，再查看已有真实交付。点击下方章节可跳转。</p><div class="note"><strong>产品已更新到 v0.7 对话版。</strong>现在可直接说任务，不必依次填写目标与跟进表单。下面保留 v0.6 的历史教学视频。<a href="../personal/">打开当前对话版 →</a></div><video id="video" controls playsinline preload="metadata" poster="poster.jpg"><source src="walkthrough.mp4" type="video/mp4"><track src="captions.vtt" kind="captions" srclang="zh" label="中文逐句字幕">浏览器无法播放时，请下载下方 MP4。</video><nav><button id="playpause" type="button">播放视频</button><a href="walkthrough.mp4" download="亦伴-v0.6-操作演示.mp4">下载 MP4</a><a href="transcript.md">阅读完整讲解稿</a><a href="../demo/">原版六步真实案例</a></nav><div id="chapters" class="chapters" aria-label="视频章节"></div><div class="note">画面是实际操作截图剪辑，省略了等待过程，非连续屏幕录像。公开示例不调用模型、不执行定时任务；真实交付来自上一轮已保存记录，本次制作未追加模型调用。系统中文配音，无背景音乐。真实委托需本机服务运行；关机或停止服务后不能继续。邮件、日历和电脑操作尚未接入。</div></main><script>
const video=document.querySelector('#video');const playpause=document.querySelector('#playpause');playpause.addEventListener('click',()=>{if(video.paused)video.play().catch(()=>{});else video.pause();});video.addEventListener('play',()=>playpause.textContent='暂停视频');video.addEventListener('pause',()=>playpause.textContent='播放视频');let timeline=[];fetch('timeline.json').then(r=>r.json()).then(rows=>{timeline=rows;const container=document.querySelector('#chapters');rows.forEach(row=>{const button=document.createElement('button');button.type='button';const minutes=Math.floor(row.start/60),seconds=String(row.start%60).padStart(2,'0');const time=document.createElement('small');time.textContent=`${minutes}:${seconds} · ${row.badge}`;const title=document.createElement('span');title.textContent=row.title;button.append(time,title);button.addEventListener('click',()=>{video.currentTime=row.start;video.play().catch(()=>{});});container.append(button);});});video.addEventListener('timeupdate',()=>{document.querySelectorAll('.chapters button').forEach((button,i)=>{const row=timeline[i];button.setAttribute('aria-current',String(video.currentTime>=row.start&&video.currentTime<row.start+row.duration));});});
</script></body></html>
